name: Image

on:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/qubut/patent-ate

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Install devenv
        run: nix profile install --accept-flake-config nixpkgs#devenv

      - name: Build prod image
        run: devenv container build prod

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          set -euo pipefail
          # devenv --registry is a prefix; it appends name:version.
          # Load into docker, then tag and push the refs we want.
          devenv container copy prod --registry docker-daemon:

          docker tag patent-ate:latest "${IMAGE}:sha-${GITHUB_SHA::7}"
          docker push "${IMAGE}:sha-${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            docker tag patent-ate:latest "${IMAGE}:${GITHUB_REF_NAME}"
            docker push "${IMAGE}:${GITHUB_REF_NAME}"
            if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              docker tag patent-ate:latest "${IMAGE}:latest"
              docker push "${IMAGE}:latest"
            fi
          else
            docker tag patent-ate:latest "${IMAGE}:${GITHUB_REF_NAME}"
            docker push "${IMAGE}:${GITHUB_REF_NAME}"
          fi
